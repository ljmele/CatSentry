<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Sentry Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/storage.js"></script>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #1a1a1a; color: #00ff00; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { border-bottom: 2px solid #00ff00; padding-bottom: 10px; }
        button { 
            background-color: #00ff00; color: #000; border: none; padding: 15px 30px; 
            font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 20px;
        }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .status { margin-bottom: 20px; font-size: 14px; color: #888; }
        #log { 
            background: #000; border: 1px solid #333; height: 150px; 
            overflow-y: scroll; padding: 10px; margin-bottom: 20px; font-size: 12px;
        }
        .card { background: #222; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>CAT SENTRY v1.0</h1>
    <div class="status" id="statusLine">System: DISCONNECTED</div>
    
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button id="connectBtn" onclick="connectToCat()">CONNECT TO DEVICE</button>
        <button onclick="downloadCSV()" style="background-color: #36a2eb; color: #fff;">DOWNLOAD CSV</button>
        <button onclick="openSettings()" style="background-color: #333; color: #fff; border: 1px solid #00ff00;">☁️ GITHUB SYNC</button>
        <button onclick="clearData()" style="background-color: #ff6384; color: #fff;">CLEAR HISTORY</button>
    </div>

    <div class="card">
        <h3>Activity Statistics</h3>
        <canvas id="activityChart"></canvas>
    </div>

    <!-- New Analytics Section -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="card">
            <canvas id="visitsChart"></canvas>
        </div>
        <div class="card">
            <canvas id="durationChart"></canvas>
        </div>
    </div>
    
    <div class="card">
        <canvas id="hourlyChart" style="max-height: 400px;"></canvas>
    </div>

    <div class="card">
        <h3>Event Log</h3>
        <div id="log">Waiting for connection...</div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    // These must match your Arduino UUIDs exactly
    const serviceUUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const charUUID    = "19b10001-e8f2-537e-4f6c-d104768a1214";
    const historyUUID = "19b10003-e8f2-537e-4f6c-d104768a1214";

    let device, server, service, characteristic, historyChar;
    
    // Load from LocalStorage
    let eventHistory = JSON.parse(localStorage.getItem('catSentryData')) || [];
    let entryCount = eventHistory.filter(e => e.type === 1).length;
    let exitCount = eventHistory.filter(e => e.type === 2).length;

    // Initialize Chart
    const ctx = document.getElementById('activityChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Entries', 'Exits'],
            datasets: [{
                label: 'Total Activity',
                data: [entryCount, exitCount],
                backgroundColor: ['#36a2eb', '#ff6384'],
                borderColor: '#fff',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true, grid: { color: '#333' } }, x: { grid: { color: '#333' } } },
            plugins: { legend: { labels: { color: '#fff' } } }
        }
    });

    // --- PERSISTENCE & UTILS ---
    function addEvent(timestamp, type) {
        // Dedup: Check if we already have this exact timestamp + type
        // Note: For large datasets, a Set or Map is faster, but for <10k items array is fine.
        const exists = eventHistory.some(e => e.timestamp === timestamp && e.type === type);
        if (exists) return false;

        eventHistory.push({ timestamp, type });
        if (type === 1) entryCount++;
        if (type === 2) exitCount++;
        
        // Optimize: Don't sort/save/updateUI on every single bulk history item.
        // We will call save/update manually after bulk ops.
        return true;
    }

    function saveData() {
        // Sort before saving to ensure order
        eventHistory.sort((a, b) => a.timestamp - b.timestamp);
        localStorage.setItem('catSentryData', JSON.stringify(eventHistory));
    }

    function updateUI() {
        chart.data.datasets[0].data = [entryCount, exitCount];
        chart.update();

        // Update Advanced Analytics
        if (typeof updateAnalytics === 'function') {
            updateAnalytics(eventHistory);
        }
    }

    function downloadCSV() {
        let csv = "Timestamp,Date,Type\n";
        // Ensure sorted for export
        const sorted = [...eventHistory].sort((a, b) => a.timestamp - b.timestamp);
        sorted.forEach(e => {
            const dateStr = new Date(e.timestamp).toLocaleString();
            const typeStr = (e.type === 1) ? "ENTRY" : "EXIT";
            csv += `${e.timestamp},"${dateStr}",${typeStr}\n`;
        });
        
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cat_sentry_data.csv';
        a.click();
    }

    function clearData() {
        if(confirm("Are you sure you want to delete all history?")) {
            localStorage.removeItem('catSentryData');
            eventHistory = [];
            entryCount = 0; 
            exitCount = 0;
            updateUI();
            updateLog("History cleared.");
        }
    }

    async function connectToCat() {
        try {
            updateLog("Scanning for CatSentry...");
            
            device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'CatSentry' }],
                optionalServices: [serviceUUID]
            });

            device.addEventListener('gattserverdisconnected', onDisconnected);

            updateLog("Connecting to GATT Server...");
            server = await device.gatt.connect();
            service = await server.getPrimaryService(serviceUUID);

            // --- STEP 1: SETUP LISTENERS (OPEN THE EARS) ---
            
            // A. Live Events
            characteristic = await service.getCharacteristic(charUUID);
            await characteristic.startNotifications();
            characteristic.addEventListener('characteristicvaluechanged', handleNotifications);
            
            // B. History Data (CRITICAL: Listen BEFORE triggering dump)
            historyChar = await service.getCharacteristic(historyUUID);
            await historyChar.startNotifications();
            historyChar.addEventListener('characteristicvaluechanged', handleHistoryData);
            
            updateLog("Listeners ready.");

            // --- STEP 2: TRIGGER SYNC (SHOUT THE COMMAND) ---
            
            const timeChar = await service.getCharacteristic("19b10002-e8f2-537e-4f6c-d104768a1214");
            const nowSeconds = Math.floor(Date.now() / 1000);
            const timeBuffer = new Uint32Array([nowSeconds]);
            
            updateLog("Sending Time Sync...");
            await timeChar.writeValue(timeBuffer); // <--- This now triggers the Arduino dump safely
            
            
            // --- UI CLEANUP ---
            document.getElementById('connectBtn').innerText = "CONNECTED";
            document.getElementById('connectBtn').disabled = true;
            document.getElementById('statusLine').innerText = "System: ONLINE | Battery: OK";
            updateLog("Link established! Waiting for history...");

        } catch (error) {
            console.log(error);
            updateLog("Error: " + error);
        }
    }

    let saveTimer;

    function handleNotifications(event) {
        const value = event.target.value;
        const decoder = new TextDecoder('utf-8');
        const message = decoder.decode(value).trim(); // "ENTRY" or "EXIT"

        const timestampStr = new Date().toLocaleTimeString();
        updateLog(`[${timestampStr}] EVENT TRIGGERED: ${message}`);

        const type = (message === "ENTRY") ? 1 : (message === "EXIT") ? 2 : 0;
        
        if (type > 0) {
            // Add, Save, Update immediately for live events
            addEvent(Date.now(), type);
            saveData();
            updateUI();

            // Auto-push live events to cloud
            if (ghStorage.isConfigured) {
                ghStorage.pushData(eventHistory);
            }
        }
    }

    function handleHistoryData(event) {
        const value = event.target.value;
        
        // Arduino sends LogEntry struct: 4 bytes (uint32_t timestamp) + 1 byte (uint8_t type)
        if (value.byteLength >= 5) {
            const dataView = new DataView(value.buffer);
            const tsSec = dataView.getUint32(0, true); // little-endian
            const type = dataView.getUint8(4);
            
            // Add to list (returns true if new)
            if (addEvent(tsSec * 1000, type)) {
                // Optional: Log every single history item? Might spam.
                // updateLog(`[HISTORY] Loaded event.`); 
            }
            
            // Debounce the expensive Save/Chart Update operations
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                saveData();
                updateUI();
                
                // --- AUTO SYNC ---
                if (ghStorage.isConfigured) {
                   ghStorage.pushData(eventHistory);
                }

                updateLog("History sync finished. Data saved.");
            }, 500);
        }
    }

    function onDisconnected(event) {
        updateLog("Device Disconnected.");
        document.getElementById('connectBtn').innerText = "CONNECT TO DEVICE";
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('statusLine').innerText = "System: DISCONNECTED";
    }

    function updateLog(text) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML = `<div>> ${text}</div>` + logDiv.innerHTML;
    }
</script>

</body>
</html>
