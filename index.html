<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Sentry Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/analytics.js?v=1.3"></script>
    <script src="js/storage.js?v=1.3"></script>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #1a1a1a; color: #00ff00; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { border-bottom: 2px solid #00ff00; padding-bottom: 10px; }
        
        /* Buttons */
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        button { 
            background-color: #00ff00; color: #000; border: none; padding: 10px 20px; 
            font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px;
        }
        button:hover { opacity: 0.8; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .btn-danger { background-color: #ff4444; color: #fff; }
        
        .status { margin-bottom: 20px; font-size: 14px; color: #888; }
        
        /* Log */
        #log { 
            background: #000; border: 1px solid #333; height: 100px; 
            overflow-y: scroll; padding: 10px; margin-bottom: 20px; font-size: 12px;
        }
        
        /* Grid Layout for Charts */
        .grid-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .full-width { grid-column: span 2; }
        
        .card { background: #222; padding: 15px; border-radius: 8px; position: relative; }
        .card h3 { margin-top: 0; color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; }
        
        /* Period Toggle */
        .controls { position: absolute; top: 15px; right: 15px; }
        .period-btn { 
            padding: 5px 10px; font-size: 12px; background: #333; color: #888; 
            margin-left: 2px; border: 1px solid #444; 
        }
        .period-btn.active { background: #00ff00; color: #000; }
        
        /* Stats bar */
        .stats-bar { 
            display: flex; gap: 20px; margin-bottom: 20px; 
            background: #222; padding: 10px 15px; border-radius: 8px;
        }
        .stat-item { text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #00ff00; }
        .stat-label { font-size: 12px; color: #888; }
        
        /* Recent Events List */
        .recent-events { list-style: none; padding: 0; margin: 0; }
        .recent-events li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
        .recent-events li:last-child { border-bottom: none; }
        .recent-events li:hover { background: #2a2a2a; }
        .event-type {
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            min-width: 60px;
            text-align: center;
        }
        .event-type.entry { background: #36a2eb; color: #fff; }
        .event-type.exit { background: #ff6384; color: #fff; }
        .event-time { color: #888; font-size: 12px; }
        .event-date { color: #aaa; }
        .no-events { color: #666; text-align: center; padding: 20px; font-style: italic; }
        
        @media (max-width: 768px) {
            .grid-row { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .stats-bar { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CAT SENTRY v1.3</h1>
    <div class="status" id="statusLine">System: DISCONNECTED</div>
    
    <!-- Quick Stats -->
    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-value" id="statEntries">0</div>
            <div class="stat-label">Entries</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="statExits">0</div>
            <div class="stat-label">Exits</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="statCatStatus">❓</div>
            <div class="stat-label">Cat Status</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="statDataQuality">-</div>
            <div class="stat-label">Data Quality</div>
        </div>
    </div>
    
    <!-- Controls -->
    <div class="btn-group">
        <button id="connectBtn" onclick="connectToCat()">CONNECT TO DEVICE</button>
        <button onclick="downloadCSV()" style="background-color: #36a2eb; color: #fff;">DOWNLOAD CSV</button>
        <button onclick="openSettings()" style="background-color: #333; color: #fff; border: 1px solid #00ff00;">☁️ GITHUB SYNC</button>
        <button onclick="cleanupData()" style="background-color: #ff9800; color: #000;">🧹 CLEANUP DATA</button>
    </div>

    <!-- 1. Console / Event Log -->
    <div class="card" style="margin-bottom: 20px;">
        <h3 style="margin-bottom: 5px">Event Log</h3>
        <div id="log">Waiting for connection...</div>
    </div>

    <!-- 2. Recent Events (Last 10) -->
    <div class="card" style="margin-bottom: 20px;">
        <h3>Recent Activity</h3>
        <ul class="recent-events" id="recentEventsList">
            <li class="no-events">No events recorded yet</li>
        </ul>
    </div>

    <!-- 3. Main Analytics with Day/Week/Month Toggle -->
    <div class="grid-row">
        <!-- Frequency Chart (Full Width) -->
        <div class="card full-width" style="height: 300px;">
            <h3>Outing Frequency</h3>
            
            <div class="controls">
                <button class="period-btn active" id="btn-day" onclick="setChartPeriod('day')">Day</button>
                <button class="period-btn" id="btn-week" onclick="setChartPeriod('week')">Week</button>
                <button class="period-btn" id="btn-month" onclick="setChartPeriod('month')">Month</button>
            </div>
            
            <div style="height: 230px; position: relative;">
                <canvas id="visitsChart"></canvas>
            </div>
        </div>

        <!-- Duration Chart (Full Width) -->
        <div class="card full-width" style="height: 300px;">
            <h3>Time Outside</h3>
            <div style="height: 230px; position: relative;">
                <canvas id="durationChart"></canvas>
            </div>
        </div>

        <!-- Row 3: Live Status & Radar -->
        <div class="card">
            <h3>Total Activity (Lifetime)</h3>
            <canvas id="activityChart" style="max-height: 250px;"></canvas>
        </div>
        
        <div class="card">
            <h3>Preferred Hours</h3>
            <canvas id="hourlyChart" style="max-height: 250px;"></canvas>
        </div>
    </div>
    
</div>

<script>
    // --- CONFIGURATION ---
    const serviceUUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const charUUID    = "19b10001-e8f2-537e-4f6c-d104768a1214";
    const historyUUID = "19b10003-e8f2-537e-4f6c-d104768a1214";
    
    // Validation constants (must match Arduino)
    const MIN_VALID_TIMESTAMP = 1577836800000; // Jan 1, 2020 in ms

    let device, server, service, characteristic, historyChar;
    
    // Load from LocalStorage
    let eventHistory = JSON.parse(localStorage.getItem('catSentryData')) || [];
    
    // Clean up any existing bad data on load
    eventHistory = eventHistory.filter(e => e.timestamp >= MIN_VALID_TIMESTAMP);
    
    let entryCount = eventHistory.filter(e => e.type === 1).length;
    let exitCount = eventHistory.filter(e => e.type === 2).length;

    // Initialize Chart
    const ctx = document.getElementById('activityChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Entries', 'Exits'],
            datasets: [{
                label: 'Total Activity',
                data: [entryCount, exitCount],
                backgroundColor: ['#36a2eb', '#ff6384'],
                borderColor: '#fff',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true, grid: { color: '#333' } }, x: { grid: { color: '#333' } } },
            plugins: { legend: { labels: { color: '#fff' } } }
        }
    });

    // --- VALIDATION ---
    function isValidEvent(timestamp, type) {
        // Check timestamp is reasonable
        if (timestamp < MIN_VALID_TIMESTAMP) {
            console.warn(`Rejected event: timestamp ${timestamp} is before 2020`);
            return false;
        }
        
        // Check timestamp is not in the future (allow 1 minute tolerance for clock drift)
        if (timestamp > Date.now() + 60000) {
            console.warn(`Rejected event: timestamp ${timestamp} is in the future`);
            return false;
        }
        
        // Check type is valid
        if (type !== 1 && type !== 2) {
            console.warn(`Rejected event: invalid type ${type}`);
            return false;
        }
        
        return true;
    }

    // --- PERSISTENCE & UTILS ---
    function addEvent(timestamp, type) {
        // Validate first
        if (!isValidEvent(timestamp, type)) {
            return false;
        }
        
        // Dedup with 5-second fuzzy match
        const exists = eventHistory.some(e => {
            return e.type === type && Math.abs(e.timestamp - timestamp) < 5000;
        });

        if (exists) return false;

        eventHistory.push({ timestamp, type });
        if (type === 1) entryCount++;
        if (type === 2) exitCount++;
        
        return true;
    }

    function saveData() {
        eventHistory.sort((a, b) => a.timestamp - b.timestamp);
        localStorage.setItem('catSentryData', JSON.stringify(eventHistory));
    }

    function updateUI() {
        chart.data.datasets[0].data = [entryCount, exitCount];
        chart.update();
        
        // Update stats bar
        document.getElementById('statEntries').textContent = entryCount;
        document.getElementById('statExits').textContent = exitCount;
        
        // Determine cat status based on last event
        const sorted = [...eventHistory].sort((a, b) => b.timestamp - a.timestamp);
        if (sorted.length > 0) {
            const lastEvent = sorted[0];
            const status = lastEvent.type === 2 ? "🌳 Outside" : "🏠 Inside";
            document.getElementById('statCatStatus').textContent = status;
        }
        
        // Calculate data quality (ratio of paired events)
        const quality = calculateDataQuality();
        document.getElementById('statDataQuality').textContent = quality + "%";

        // Update Recent Events list
        updateRecentEvents();

        // Update Advanced Analytics
        if (typeof updateAnalytics === 'function') {
            updateAnalytics(eventHistory);
        }
    }
    
    function updateRecentEvents() {
        const listEl = document.getElementById('recentEventsList');
        if (!listEl) return; // Guard against missing DOM element
        
        if (eventHistory.length === 0) {
            listEl.innerHTML = '<li class="no-events">No events recorded yet</li>';
            return;
        }
        
        // Get last 10 events, most recent first
        const recent = [...eventHistory]
            .sort((a, b) => b.timestamp - a.timestamp)
            .slice(0, 10);
        
        listEl.innerHTML = recent.map(event => {
            const date = new Date(event.timestamp);
            const typeLabel = event.type === 1 ? 'ENTRY' : 'EXIT';
            const typeClass = event.type === 1 ? 'entry' : 'exit';
            const icon = event.type === 1 ? '🏠' : '🌳';
            
            // Format time nicely
            const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const dateStr = date.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
            
            // Check if this is today
            const today = new Date();
            const isToday = date.toDateString() === today.toDateString();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const isYesterday = date.toDateString() === yesterday.toDateString();
            
            let displayDate = dateStr;
            if (isToday) displayDate = 'Today';
            else if (isYesterday) displayDate = 'Yesterday';
            
            return `
                <li>
                    <span>
                        <span class="event-type ${typeClass}">${icon} ${typeLabel}</span>
                    </span>
                    <span>
                        <span class="event-date">${displayDate}</span>
                        <span class="event-time"> at ${timeStr}</span>
                    </span>
                </li>
            `;
        }).join('');
    }
    
    function calculateDataQuality() {
        if (eventHistory.length === 0) return 100;
        
        // Count how many exit-entry pairs we have
        const sorted = [...eventHistory].sort((a, b) => a.timestamp - b.timestamp);
        let pairs = 0;
        let pendingExit = false;
        
        for (const event of sorted) {
            if (event.type === 2) { // EXIT
                if (pendingExit) {
                    // Double exit = missed entry
                } else {
                    pendingExit = true;
                }
            } else if (event.type === 1) { // ENTRY
                if (pendingExit) {
                    pairs++;
                    pendingExit = false;
                }
                // Entry without exit = missed exit (we don't penalize this as much)
            }
        }
        
        const totalExits = sorted.filter(e => e.type === 2).length;
        if (totalExits === 0) return 100;
        
        return Math.round((pairs / totalExits) * 100);
    }

    function cleanupData() {
        if (!confirm("This will remove all events with invalid timestamps (1970 dates). Continue?")) {
            return;
        }
        
        const before = eventHistory.length;
        eventHistory = eventHistory.filter(e => e.timestamp >= MIN_VALID_TIMESTAMP);
        const after = eventHistory.length;
        
        // Recalculate counts
        entryCount = eventHistory.filter(e => e.type === 1).length;
        exitCount = eventHistory.filter(e => e.type === 2).length;
        
        saveData();
        updateUI();
        
        updateLog(`Cleanup complete: removed ${before - after} invalid events`);
        
        // Re-sync to cloud
        if (ghStorage.isConfigured) {
            ghStorage.pushData(eventHistory);
        }
    }

    function downloadCSV() {
        let csv = "Timestamp,Date,Type,Valid\n";
        const sorted = [...eventHistory].sort((a, b) => a.timestamp - b.timestamp);
        sorted.forEach(e => {
            const dateStr = new Date(e.timestamp).toLocaleString();
            const typeStr = (e.type === 1) ? "ENTRY" : "EXIT";
            const valid = e.timestamp >= MIN_VALID_TIMESTAMP ? "Yes" : "No";
            csv += `${e.timestamp},"${dateStr}",${typeStr},${valid}\n`;
        });
        
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cat_sentry_data.csv';
        a.click();
    }

    // --- CLOUD SYNC ---
    function openSettings() {
        let owner = prompt("GitHub Username:", ghStorage.config.owner);
        if(owner === null) return;
        
        let repo = prompt("Repository Name (e.g., CatSentry):", ghStorage.config.repo);
        if(repo === null) return;

        let token = prompt("Personal Access Token (starts with ghp_...):", ghStorage.config.token);
        if(token === null) return;

        owner = owner.trim();
        repo = repo.trim();
        token = token.trim();

        if (owner && repo && token) {
            ghStorage.saveConfig(owner, repo, token);
            updateLog(`Credentials saved for: ${owner}/${repo}`);
            syncWithCloud();
        } else {
            updateLog("Error: Setup cancelled or fields empty.");
        }
    }

    async function syncWithCloud() {
        const remoteData = await ghStorage.pullData();
        
        if (remoteData) {
            // Filter remote data for valid timestamps too
            const validRemote = remoteData.filter(e => e.timestamp >= MIN_VALID_TIMESTAMP);
            
            let merged = [...eventHistory, ...validRemote];
            
            const uniqueStringEvents = new Set(merged.map(e => JSON.stringify(e)));
            const uniqueEvents = Array.from(uniqueStringEvents).map(s => JSON.parse(s));
            
            eventHistory = uniqueEvents;
            entryCount = eventHistory.filter(e => e.type === 1).length;
            exitCount = eventHistory.filter(e => e.type === 2).length;
            
            saveData(); 
            updateUI();
        }
        
        await ghStorage.pushData(eventHistory);
    }

    async function connectToCat() {
        try {
            updateLog("Scanning for CatSentry...");
            
            device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'CatSentry' }],
                optionalServices: [serviceUUID]
            });

            device.addEventListener('gattserverdisconnected', onDisconnected);

            updateLog("Connecting to GATT Server...");
            server = await device.gatt.connect();
            service = await server.getPrimaryService(serviceUUID);

            // A. Live Events
            characteristic = await service.getCharacteristic(charUUID);
            await characteristic.startNotifications();
            characteristic.addEventListener('characteristicvaluechanged', handleNotifications);
            
            // B. History Data
            historyChar = await service.getCharacteristic(historyUUID);
            await historyChar.startNotifications();
            historyChar.addEventListener('characteristicvaluechanged', handleHistoryData);
            
            updateLog("Listeners ready.");

            // Send Time Sync
            const timeChar = await service.getCharacteristic("19b10002-e8f2-537e-4f6c-d104768a1214");
            const nowSeconds = Math.floor(Date.now() / 1000);
            const timeBuffer = new Uint32Array([nowSeconds]);
            
            updateLog(`Sending Time Sync: ${nowSeconds} (${new Date().toLocaleString()})`);
            await timeChar.writeValue(timeBuffer);
            
            // UI
            document.getElementById('connectBtn').innerText = "CONNECTED";
            document.getElementById('connectBtn').disabled = true;
            document.getElementById('statusLine').innerText = "System: ONLINE | Battery: OK";
            updateLog("Link established! Waiting for history...");

        } catch (error) {
            console.log(error);
            updateLog("Error: " + error);
        }
    }

    let saveTimer;
    let historyEventCount = 0;

    function handleNotifications(event) {
        const value = event.target.value;
        const decoder = new TextDecoder('utf-8');
        const message = decoder.decode(value).trim();

        const timestampStr = new Date().toLocaleTimeString();
        updateLog(`[${timestampStr}] EVENT TRIGGERED: ${message}`);

        const type = (message === "ENTRY") ? 1 : (message === "EXIT") ? 2 : 0;
        
        if (type > 0) {
            addEvent(Date.now(), type);
            saveData();
            updateUI();

            if (ghStorage.isConfigured) {
                ghStorage.pushData(eventHistory);
            }
        }
    }

    function handleHistoryData(event) {
        const value = event.target.value;
        
        if (value.byteLength >= 5) {
            const dataView = new DataView(value.buffer);
            const tsSec = dataView.getUint32(0, true);
            const type = dataView.getUint8(4);
            const tsMs = tsSec * 1000;
            
            // Validate before adding
            if (isValidEvent(tsMs, type)) {
                if (addEvent(tsMs, type)) {
                    historyEventCount++;
                }
            } else {
                updateLog(`⚠️ Rejected invalid history event (ts: ${tsSec})`);
            }
            
            // Debounce save/update
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                saveData();
                updateUI();
                
                if (ghStorage.isConfigured) {
                   ghStorage.pushData(eventHistory);
                }

                updateLog(`History sync finished. Loaded ${historyEventCount} new events.`);
                historyEventCount = 0;
            }, 500);
        }
    }

    function onDisconnected(event) {
        updateLog("Device Disconnected.");
        document.getElementById('connectBtn').innerText = "CONNECT TO DEVICE";
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('statusLine').innerText = "System: DISCONNECTED";
    }

    function updateLog(text) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML = `<div>> ${text}</div>` + logDiv.innerHTML;
    }

    // --- AUTO STARTUP ---
    updateUI(); // Show initial stats
    
    if (ghStorage && ghStorage.isConfigured) {
        updateLog("Found GitHub credentials. Checking for updates...");
        syncWithCloud();
    }
</script>

</body>
</html>
