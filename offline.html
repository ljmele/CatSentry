<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marie Sentry Offline</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #161616;
      --text: #f0f0f0;
      --muted: #9aa0a6;
      --accent: #00e676;
      --border: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 20% -10%, rgba(0,230,118,0.12), transparent), var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 12px 0;
      color: var(--muted);
      line-height: 1.45;
    }
    .actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary {
      background: var(--accent);
      color: #04170d;
    }
    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>You are offline</h1>
    <p>Marie Sentry cannot reach the network right now. Cached dashboard files are still available, and data already stored on this device is safe.</p>
    <p>Reconnect to sync weather and GitHub cloud data.</p>
    <div class="actions">
      <button class="primary" onclick="location.reload()">Try again</button>
      <button class="secondary" onclick="location.href='./index.html'">Open dashboard</button>
    </div>
  </main>
</body>
</html>
